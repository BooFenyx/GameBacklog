name: Déploiement production (CLI Vercel)

# Déclenchement à chaque push sur la branche de production.
# Le déploiement passe par la CLI Vercel et un token : aucune vérification
# d'auteur de commit n'est faite, contrairement à l'intégration Git native
# (désactivée via "git": { "deploymentEnabled": false } dans web/vercel.json).
on:
  push:
    branches: [main]

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      - name: Récupérer les réglages du projet
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire l'artefact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer l'artefact préconstruit
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
