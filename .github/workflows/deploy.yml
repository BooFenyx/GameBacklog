name: Déploiement production (CLI Vercel)

# Déclenché uniquement après une CI verte sur main. Le workflow de déploiement
# n'écoute plus directement `push` : un commit rouge ne peut donc plus partir
# en production (le build Vercel ne lance ni lint ni tests).
#
# La CLI Vercel (>= v44) contrôle l'auteur du commit même avec un token :
# l'auteur de HEAD doit correspondre au compte Vercel propriétaire du projet.
# On réécrit donc l'auteur dans le runner avant de déployer. L'amend n'est
# jamais poussé : l'historique GitHub reste intact.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-prod-main
  # Ne jamais annuler un déploiement en cours : la production resterait sur un
  # commit antérieur sans alerte explicite.
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  URL_PRODUCTION: ${{ vars.VERCEL_PRODUCTION_URL || 'https://fst-2026-groupe-08.vercel.app' }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Vérifier la présence des secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOYER_EMAIL: ${{ secrets.VERCEL_DEPLOYER_EMAIL }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Secret VERCEL_TOKEN manquant ou vide"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::Secret VERCEL_ORG_ID manquant ou vide"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::Secret VERCEL_PROJECT_ID manquant ou vide"; exit 1; }
          [ -n "$VERCEL_DEPLOYER_EMAIL" ] || { echo "::error::Secret VERCEL_DEPLOYER_EMAIL manquant ou vide"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer la CLI Vercel
        run: npm install --global vercel@65

      # La CLI Vercel vérifie que l'auteur de HEAD a accès au projet Vercel,
      # même en déploiement par token. On réécrit l'auteur uniquement dans le
      # runner : l'amend n'est jamais poussé.
      - name: Aligner l'auteur du commit sur le compte Vercel
        env:
          VERCEL_DEPLOYER_EMAIL: ${{ secrets.VERCEL_DEPLOYER_EMAIL }}
        run: |
          git config user.name "deployer"
          git config user.email "$VERCEL_DEPLOYER_EMAIL"
          git commit --amend --no-edit --reset-author

      - name: Récupérer les réglages du projet
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire l'artefact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer l'artefact préconstruit
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vérifier la production (API + front)
        run: |
          for tentative in $(seq 1 12); do
            if curl -fsS "$URL_PRODUCTION/api/health" > /dev/null; then
              echo "API en ligne (tentative $tentative)"
              break
            fi
            if [ "$tentative" -eq 12 ]; then
              echo "::error::L'API de production ne répond pas sur /api/health"
              exit 1
            fi
            sleep 10
          done
          curl -fsS "$URL_PRODUCTION/" > /dev/null
          echo "Front et API joignables"
