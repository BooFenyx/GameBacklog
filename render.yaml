# Blueprint Render — API GameBacklog.
#
# Le front est hébergé sur Vercel (voir web/vercel.json) ; ce fichier ne
# décrit que l'API. Création : Render → New → Blueprint → ce dépôt.
#
# Variables marquées `sync: false` : Render les demande une seule fois au
# moment de la création du blueprint.
#   - DATABASE_URL   : chaîne de connexion Neon (neon.tech)
#   - STEAM_API_KEY  : clé Steam Web API (steamcommunity.com/dev/apikey)
#   - EMBEDDING_API_KEY : clé Gemini (aistudio.google.com)
#   - FRONTEND_URL   : URL du site Vercel (ex. https://gamebacklog.vercel.app)
#
# Les migrations sont appliquées au démarrage de l'API (DbModule) : le plan
# gratuit de Render n'admet pas de preDeployCommand, et c'est aussi ce qui
# dispense de toute commande après l'ajout d'une fonctionnalité.
services:
  - type: web
    runtime: node
    # Nom réel du service Render (l'URL publique doit rester
    # fst-2026-groupe-08.onrender.com, utilisé par web/vercel.json). Si le
    # service est recréé avec un autre nom, mettre à jour le rewrite Vercel.
    name: fst-2026-groupe-08
    plan: free
    region: oregon
    # Redéploie uniquement quand les checks CI de la branche passent. Le front
    # Vercel attend aussi une CI verte (workflow_run dans deploy.yml).
    autoDeployTrigger: checksPass
    rootDir: api
    # `--include=dev` est indispensable : NODE_ENV=production fait omettre les
    # devDependencies par `npm ci`, or `nest build` a besoin de `@nestjs/cli` et
    # `typescript` (tous deux en devDependencies).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render ne lit pas forcément `engines.node` : on fixe la version requise
      # par le projet (>=24.0.0) de manière explicite.
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: 1024
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
